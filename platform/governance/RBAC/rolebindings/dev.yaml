apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers-admin
  namespace: dev
  labels:
    app.kubernetes.io/managed-by: kustomize
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: developers

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin